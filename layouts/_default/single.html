<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
<head>{{ partial "head.html" . }}</head>
<body>
  {{ partial "nav.html" . }}
  <main class="main">
    <div class="container">
      <article>
        <h1>{{ .Title }}</h1>
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2. 1. 2006" }}</time>
        <div class="episode__content">{{ .Content }}</div>
      </article>
    </div>
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
